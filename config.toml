baseurl = "https://paul.kinlan.me/"
languageCode = "en-us"
title = "Modern Web Development with Chrome"

Copyright = "Paul Kinlan 2020"
DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
[pagination]
pagerSize = 20

# Syntax-highlighting palette for fenced code blocks, in Hugo's canonical
# location. The three `pygments*` keys that used to sit just above were written
# after the `[pagination]` header, so TOML filed them under `pagination` and Hugo
# never applied them (`hugo config` showed
# `pagination = map[... pygmentsstyle:monokai ...]`). The site was therefore
# rendering Hugo's *default* palette - monokai, by coincidence the same style -
# and three of its tokens are below the WCAG 2.1 AA 4.5:1 floor against the colour
# each is read on: comment grey #75715e at 3.02:1 and operator pink #f92672 at
# 3.92:1 on monokai's #272822 block, and the error token #960050 at 2.27:1 on the
# #1e0010 chip it paints for itself (120 spans, 80 of them a visible '$' on
# /adding-activity-pub-to-your-static-site/, a page the bead's axe run never
# covered). The article's code text measures 14.2px/10.7pt in Chrome, so the 3:1
# large-text allowance does not apply. axe-core found 26 of these nodes in one post
# and 11 in another; the same three colours are written by 2,948 spans across the
# built site.
#
# github-dark keeps the dark code block - inline styles, Hugo's `noClasses`
# default - with every token that can carry a visible glyph at >= 4.5:1 against
# the background it is read on. The palette is pinned by
# tests/chroma-contrast.test.mjs, so a future style cannot silently reintroduce a
# dim token. Only the palette moves here: `guessSyntax`
# was swallowed by the same nesting mistake, so unlabelled fences render as plain
# <pre> today (161 of the site's 392 <pre> blocks) and are left exactly as they
# render - enabling guessing would newly highlight all of them.
[markup.highlight]
style = "github-dark"

[services.rss]
limit = 50

[permalinks]
post = "/:title/"

[author]
name = "Paul Kinlan"
email = "paul.kinlan@gmail.com"

[params]
author = "Paul Kinlan"
description = "Paul is a Developer Advocate for Chrome and the Open Web at Google and loves to help make web development easier."
analyticsid = "UA-114468-20"

[taxonimies]
tag = "tags"

[mediaTypes]
[mediaTypes."text/javascript"]
suffixes = ["js", "mjs"]
[mediaTypes."application/activity+json"]
suffixes = ["ajson"]
[mediaTypes."text/plain"]
suffixes = ["txt"]

[outputFormats]
[outputFormats.ACTIVITY]
mediaType = "application/activity+json"
notAlternative = true
baseName = "activity"
[outputFormats.ACTIVITY_OUTBOX]
mediaType = "application/activity+json"
notAlternative = true
baseName = "outbox"
[outputFormats.LLMS_TXT]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true

[outputs]
home = ["HTML", "RSS", "ACTIVITY", "ACTIVITY_OUTBOX", "LLMS_TXT"]
section = ["HTML", "RSS"]
page = ["HTML"]

[related]
# Only include matches with rank >= threshold. This is a normalized rank between 0 and 100.
threshold = 10

# To get stable "See also" sections we, by default, exclude newer related pages.
includeNewer = true

# Will lower case keywords in both queries and in the indexes.
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[markup.goldmark.parser]
autoHeadingID = true

[markup.goldmark.extensions]
typographer = false

[markup.goldmark.renderer]
unsafe = true

# static/ is mounted TWICE on purpose: at `static` (published verbatim, as before)
# and at `assets`, which is what lets templates measure an image with
# `resources.Get` -> .Width/.Height (layouts/partials/image-dims.html). The images
# in this site are not page resources - they are files under static/ referenced by
# front matter as a string path - so without this mount the only way to know how
# big a header image is would be a hand-maintained table of sizes that goes stale
# the moment an image is replaced.
#
# Every other default mount is re-declared because declaring any `module.mounts`
# REPLACES Hugo's default set rather than adding to it: dropping one here silently
# removes that directory from the build.
[module]
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "static"
target = "assets"
