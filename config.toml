baseurl = "https://paul.kinlan.me/"
languageCode = "en-us"
title = "Modern Web Development with Chrome"

Copyright = "Paul Kinlan 2020"
[pagination]
pagerSize = 20
pygmentsCodeFences = true
pygmentsCodeFencesGuessSyntax = true
pygmentsStyle = "monokai"
DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[services.rss]
limit = 50

[permalinks]
post = "/:title/"

[author]
name = "Paul Kinlan"
email = "paul.kinlan@gmail.com"

[params]
author = "Paul Kinlan"
description = "Paul is a Developer Advocate for Chrome and the Open Web at Google and loves to help make web development easier."
analyticsid = "UA-114468-20"

[taxonimies]
tag = "tags"

[mediaTypes]
[mediaTypes."text/javascript"]
suffixes = ["js", "mjs"]
[mediaTypes."application/activity+json"]
suffixes = ["ajson"]
[mediaTypes."text/plain"]
suffixes = ["txt"]

[outputFormats]
[outputFormats.ACTIVITY]
mediaType = "application/activity+json"
notAlternative = true
baseName = "activity"
[outputFormats.ACTIVITY_OUTBOX]
mediaType = "application/activity+json"
notAlternative = true
baseName = "outbox"
[outputFormats.LLMS_TXT]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true

[outputs]
home = ["HTML", "RSS", "ACTIVITY", "ACTIVITY_OUTBOX", "LLMS_TXT"]
section = ["HTML", "RSS"]
page = ["HTML"]

[related]
# Only include matches with rank >= threshold. This is a normalized rank between 0 and 100.
threshold = 10

# To get stable "See also" sections we, by default, exclude newer related pages.
includeNewer = true

# Will lower case keywords in both queries and in the indexes.
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[markup.goldmark.parser]
autoHeadingID = true

[markup.goldmark.extensions]
typographer = false

[markup.goldmark.renderer]
unsafe = true

# static/ is mounted TWICE on purpose: at `static` (published verbatim, as before)
# and at `assets`, which is what lets templates measure an image with
# `resources.Get` -> .Width/.Height (layouts/partials/image-dims.html). The images
# in this site are not page resources - they are files under static/ referenced by
# front matter as a string path - so without this mount the only way to know how
# big a header image is would be a hand-maintained table of sizes that goes stale
# the moment an image is replaced.
#
# Every other default mount is re-declared because declaring any `module.mounts`
# REPLACES Hugo's default set rather than adding to it: dropping one here silently
# removes that directory from the build.
[module]
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "static"
target = "assets"
